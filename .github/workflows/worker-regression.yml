name: Worker 100x regression check
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'admin/**'
      - 'worker-regression-check.js'
      - '.github/workflows/worker-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check worker/src/index.js
      - name: Wrangler config parse check
        run: node -e "const fs=require('fs');JSON.parse(fs.readFileSync('worker/wrangler.jsonc','utf8'));console.log('wrangler config PASS')"
      - name: Repeat regression suite 100 times
        run: |
          set -e
          for i in $(seq 1 100); do
            echo "=== iteration $i/100 ==="
            node --check worker/src/index.js
            node worker-regression-check.js
          done
          echo "100/100 iterations PASS"
