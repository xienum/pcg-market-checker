name: Maintenance report
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-report.yml'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send maintenance report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_TEXT: "🔧 PCG Market Checker | MAINTENANCE CHECK\\n\\n✅ システム状態: 正常稼働\\n✅ 直近Run: #36204409810 SUCCESS\\n✅ 商品データ: 6/6件 取得成功\\n✅ data.json: ok=true\\n✅ GitHub Pages: 公開成功\\n✅ Discord通知: HTTP 200 / 1回目で送信成功\\n✅ 定期実行: 毎時10分 (10 * * * *)\\n\\n⚠️ Node.js url.parse() DeprecationWarning を確認\\n→ 現時点で価格取得・Pages公開・Discord通知への影響なし\\n→ 影響がないため現状維持\\n\\nメンテナンス判定: 異常なし / 本番設定変更なし"
        run: |
          python -c 'import json,os,urllib.request; data=json.dumps({"content":os.environ["REPORT_TEXT"]}).encode(); req=urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"],data=data,headers={"Content-Type":"application/json"},method="POST"); r=urllib.request.urlopen(req,timeout=20); print("Discord maintenance report delivered:",r.status)'
