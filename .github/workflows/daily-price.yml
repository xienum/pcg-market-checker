name: Market price update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-price.yml'
      - 'update-prices.js'
      - 'notify-discord.js'
      - 'system-check.js'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-price-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start diagnostic log
        run: |
          echo "PCG Market Checker diagnostic log" > market-update.log
          echo "JST: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')" >> market-update.log
          echo "Run: $GITHUB_RUN_ID / Attempt: $GITHUB_RUN_ATTEMPT" >> market-update.log
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a market-update.log
      - name: Run 10-point system check
        id: selftest
        run: |
          set -o pipefail
          node system-check.js 2>&1 | tee -a market-update.log
      - name: Update prices
        id: scrape
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== Price scrape ===" | tee -a market-update.log
          node update-prices.js 2>&1 | tee -a market-update.log
      - name: Validate generated data
        id: validate
        if: always()
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data.json','utf8'));if(!Array.isArray(d.products)||!d.products.length)throw Error('products missing');if(!Array.isArray(d.history))throw Error('history missing');if(!d.status||typeof d.status.ok!=='boolean')throw Error('status missing');if(d.status.totalCount!==d.products.length)throw Error('totalCount mismatch');const s=new Set();for(const h of d.history){const k=h.productId+'|'+h.date;if(s.has(k))throw Error('duplicate '+k);s.add(k);if(!Number.isFinite(h.price)||h.price<=0)throw Error('invalid price '+k)};console.log('data.json validation PASS')" 2>&1 | tee -a market-update.log
      - name: Save updated prices
        id: save
        if: always() && steps.validate.outcome == 'success'
        run: |
          exec > >(tee -a market-update.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No data changes to commit"; exit 0; fi
          git commit -m "Update market prices $(TZ=Asia/Tokyo date +%F)"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then echo "Push succeeded"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Configure Pages
        id: configure_pages
        if: always() && steps.scrape.outcome == 'success' && steps.validate.outcome == 'success' && steps.save.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        id: upload_pages
        if: always() && steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy updated site
        id: deployment
        if: always() && steps.upload_pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Finalize diagnostic log
        if: always()
        run: |
          echo "Install: ${{ steps.install.outcome }}" >> market-update.log
          echo "Self-test: ${{ steps.selftest.outcome }}" >> market-update.log
          echo "Scrape: ${{ steps.scrape.outcome }}" >> market-update.log
          echo "Validate: ${{ steps.validate.outcome }}" >> market-update.log
          echo "Save: ${{ steps.save.outcome }}" >> market-update.log
          echo "Pages deploy: ${{ steps.deployment.outcome }}" >> market-update.log
      - name: Send detailed Discord notification
        id: discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STEP_SCRAPE: ${{ steps.scrape.outcome }}
          STEP_SAVE: ${{ steps.save.outcome }}
          STEP_CONFIGURE_PAGES: ${{ steps.configure_pages.outcome }}
          STEP_UPLOAD_PAGES: ${{ steps.upload_pages.outcome }}
          STEP_DEPLOYMENT: ${{ steps.deployment.outcome }}
        run: |
          set -o pipefail
          node notify-discord.js 2>&1 | tee -a market-update.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-update-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-update.log
          retention-days: 30
      - name: Fail workflow if core processing failed
        if: always() && (steps.install.outcome != 'success' || steps.selftest.outcome != 'success' || steps.scrape.outcome != 'success' || steps.validate.outcome != 'success' || steps.save.outcome != 'success' || steps.discord.outcome != 'success')
        run: exit 1
