name: Market price update
on:
  schedule:
    # Check every 30 minutes at :07/:37 JST-equivalent minute positions to avoid peak scheduler congestion.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Update prices
        run: node update-prices.js

      - name: Save updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No price changes to commit"
            exit 0
          fi
          git commit -m "Update market prices $(TZ=Asia/Tokyo date +%F)"
          git push
