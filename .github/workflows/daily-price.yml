name: Market price update
on:
  schedule:
    # Every hour at minute 0. GitHub Actions cron is UTC; minute 0 is also JST minute 0.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Trigger source'
        required: false
        default: 'github-manual'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start diagnostic log
        run: |
          {
            echo "PCG Market Checker diagnostic log"
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "JST: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
            echo "Run: $GITHUB_RUN_ID / Attempt: $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA / Event: $GITHUB_EVENT_NAME / Source: ${{ inputs.source }}"
            echo "Node: $(node --version)"
            echo "========================================"
          } > market-update.log

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm install 2>&1 | tee -a market-update.log

      - name: Update prices
        id: scrape
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== Price scrape ===" | tee -a market-update.log
          node update-prices.js 2>&1 | tee -a market-update.log

      - name: Save updated prices
        id: save
        if: always()
        run: |
          exec > >(tee -a market-update.log) 2>&1
          echo "=== Save data.json ==="
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No price changes to commit"
            exit 0
          fi
          git commit -m "Update market prices $(TZ=Asia/Tokyo date +%F)"
          # Retry safely if main changes while this job is running.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to save price data after 3 attempts"
          exit 1


      - name: Add final diagnostics
        if: always()
        run: |
          {
            echo "========================================"
            echo "Scraper outcome: ${{ steps.scrape.outcome }}"
            echo "Finished UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Finished JST: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
          } >> market-update.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-update-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-update.log
          retention-days: 30

      - name: Configure Pages
        id: configure_pages
        if: always() && steps.scrape.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        id: upload_pages
        if: always() && steps.scrape.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy updated site to GitHub Pages
        if: always() && steps.scrape.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send result email
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: yuhisena@pngk.uk
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$EMAIL_FROM" ]; then
            echo "Email bot is installed but RESEND_API_KEY or EMAIL_FROM is not configured; email skipped."
            exit 0
          fi

          RESULT="SUCCESS"
          FAILED_STAGE=""
          if [ "${{ steps.install.outcome }}" != "success" ]; then RESULT="ERROR"; FAILED_STAGE="Dependency installation"; fi
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then RESULT="ERROR"; FAILED_STAGE="Price scraping"; fi
          if [ "${{ steps.save.outcome }}" != "success" ]; then RESULT="ERROR"; FAILED_STAGE="data.json save / GitHub push"; fi
          if [ "${{ steps.configure_pages.outcome }}" = "failure" ]; then RESULT="ERROR"; FAILED_STAGE="GitHub Pages configuration"; fi
          if [ "${{ steps.upload_pages.outcome }}" = "failure" ]; then RESULT="ERROR"; FAILED_STAGE="GitHub Pages upload"; fi
          if [ "${{ steps.deployment.outcome }}" = "failure" ]; then RESULT="ERROR"; FAILED_STAGE="GitHub Pages deploy"; fi

          PRODUCT_FAILURES=$(node -e '
            const fs=require("fs");
            try {
              const d=JSON.parse(fs.readFileSync("data.json","utf8"));
              const byId=new Map((d.products||[]).map(p=>[String(p.id),p.name]));
              const f=d.status?.failures||[];
              console.log(f.length ? f.map(x=>"- "+(byId.get(String(x.productId))||x.productId)+" ("+x.productId+"): "+x.message).join("\n") : "None");
            } catch(e) { console.log("Could not read product failure details: "+e.message); }
          ')

          PRICES=$(node -e '
            const fs=require("fs");
            try {
              const d=JSON.parse(fs.readFileSync("data.json","utf8"));
              const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo"}).format(new Date());
              const m=new Map((d.history||[]).filter(h=>h.date===today).map(h=>[String(h.productId),h.price]));
              console.log((d.products||[]).map(p=>"- "+p.name+" ("+p.id+"): "+(m.has(String(p.id)) ? "¥"+Number(m.get(String(p.id))).toLocaleString("ja-JP") : "取得失敗")).join("\n"));
            } catch(e) { console.log("Could not read prices: "+e.message); }
          ')

          BODY=$(printf 'PCG Market Checker | %s\nRun #%s (attempt %s)\nJST: %s\n\nPrices:\n%s\n\nFailed stage: %s\nProduct failures:\n%s\n\nFull diagnostic log:\n%s'             "$RESULT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"             "$PRICES" "${FAILED_STAGE:-None}" "$PRODUCT_FAILURES" "$(cat market-update.log)")

          PAYLOAD=$(node -e 'console.log(JSON.stringify({from:process.env.EMAIL_FROM,to:[process.env.EMAIL_TO],subject:process.env.SUBJECT,text:process.env.BODY}))'             EMAIL_FROM="$EMAIL_FROM" EMAIL_TO="$EMAIL_TO" SUBJECT="[PCG Market Checker] $RESULT - Run #$GITHUB_RUN_ID" BODY="$BODY")
          # Rebuild payload with environment variables exported for Node.
          export SUBJECT="[PCG Market Checker] $RESULT - Run #$GITHUB_RUN_ID"
          export BODY
          PAYLOAD=$(node -e 'console.log(JSON.stringify({from:process.env.EMAIL_FROM,to:[process.env.EMAIL_TO],subject:process.env.SUBJECT,text:process.env.BODY}))')

          HTTP_CODE=$(curl -sS -o email-response.json -w "%{http_code}"             -X POST "https://api.resend.com/emails"             -H "Authorization: Bearer $RESEND_API_KEY"             -H "Content-Type: application/json"             -d "$PAYLOAD")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Email delivery failed with HTTP $HTTP_CODE"
            cat email-response.json
            exit 1
          fi
          echo "Email delivered to $EMAIL_TO (HTTP $HTTP_CODE)"

      - name: Send diagnostic log to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; Discord notification skipped."
            exit 0
          fi
          RESULT="SUCCESS"
          STAGE="All stages completed"
          if [ "${{ steps.install.outcome }}" != "success" ]; then RESULT="ERROR"; STAGE="Dependency installation"; fi
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then RESULT="ERROR"; STAGE="Price scraping"; fi
          if [ "${{ steps.save.outcome }}" != "success" ]; then RESULT="ERROR"; STAGE="data.json save / GitHub push"; fi
          if [ "${{ steps.configure_pages.outcome }}" = "failure" ]; then RESULT="ERROR"; STAGE="GitHub Pages configuration"; fi
          if [ "${{ steps.upload_pages.outcome }}" = "failure" ]; then RESULT="ERROR"; STAGE="GitHub Pages upload"; fi
          if [ "${{ steps.deployment.outcome }}" = "failure" ]; then RESULT="ERROR"; STAGE="GitHub Pages deploy"; fi
          PRODUCT_FAILURES=$(node -e '
            const fs=require("fs");
            try {
              const d=JSON.parse(fs.readFileSync("data.json","utf8"));
              const byId=new Map((d.products||[]).map(p=>[String(p.id),p.name]));
              const f=d.status?.failures||[];
              console.log(f.length ? f.map(x=>(byId.get(String(x.productId))||x.productId)+" ("+x.productId+"): "+x.message).join("; ") : "None");
            } catch(e) { console.log("Unavailable"); }
          ')
          PAYLOAD=$(node -e 'console.log(JSON.stringify({content:process.env.MSG}))'             MSG="PCG Market Checker | $RESULT | Run #$GITHUB_RUN_ID\nStage: $STAGE\nProduct failures: $PRODUCT_FAILURES\nDiagnostic log attached.")
          curl --fail-with-body --retry 3 --retry-all-errors             -H "User-Agent: PCG-Market-Checker/1.0"             -F "payload_json=$PAYLOAD"             -F "files[0]=@market-update.log;type=text/plain"             "$DISCORD_WEBHOOK_URL"

      - name: Report scraper failure
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "One or more market prices could not be fetched. Status was saved to data.json."
          exit 1
