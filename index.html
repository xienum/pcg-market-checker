<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCG相場チェッカー</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><main><header><div><h1>PCG 相場チェッカー</h1><p>スニダン「1個」の最安出品価格を毎日記録・グラフ化</p><p id="updated" class="updated"></p></div><button id="refresh">表示を更新</button></header><section id="cards" class="cards"></section><section class="panel"><div class="toolbar"><h2>価格推移</h2><select id="range"><option value="7">7日</option><option value="30" selected>30日</option><option value="90">90日</option><option value="0">全期間</option></select></div><div class="chartbox"><canvas id="chart"></canvas></div></section><section class="panel"><h2>登録商品</h2><div id="products"></div></section><p class="note">価格データはGitHub Actionsが毎日11:00（日本時間）に取得します。「表示を更新」は保存済みの最新data.jsonを再読み込みします。</p></main><script src="app.js"></script></body></html>
