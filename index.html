<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>PCG相場チェッカー</title><link rel='stylesheet' href='style.css'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script></head><body><main><header><div><h1>PCG 相場チェッカー</h1><p>スニダン「1個」の最安出品価格を記録・グラフ化</p></div><button id='refresh'>最新データを取得</button></header><section id='cards' class='cards'></section><section class='panel'><div class='toolbar'><h2>価格推移</h2><select id='range'><option value='7'>7日</option><option value='30' selected>30日</option><option value='90'>90日</option><option value='0'>全期間</option></select></div><div class='chartbox'><canvas id='chart'></canvas></div></section><section class='panel'><h2>商品管理</h2><form id='addForm'><input id='name' placeholder='商品名（任意）'><input id='url' type='url' placeholder='https://snkrdunk.com/apparels/...' required><button>追加</button></form><div id='products'></div></section><p class='note'>※ ブラウザからスニダンへ直接アクセスせず、/api 経由で取得します。自動取得には server.js を常時稼働できる環境へ配置してください。</p></main><script src='app.js'></script></body></html>
