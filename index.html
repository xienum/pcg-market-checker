<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCG 相場チェッカー</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><header class="top"><div class="brand"><span class="ball">◓</span><div><b>PCG 相場チェッカー</b><small>ポケモンカードのBOX相場を毎日自動で更新</small></div></div><nav><a href="#today">ホーム</a><a href="#chartPanel">価格推移</a><a href="#productsPanel">商品一覧</a><a href="#ranking">ランキング</a></nav><div id="updated" class="updated"></div></header><main><section id="today"><div class="section-title"><h1>今日の相場</h1><span id="todayDate"></span></div><div id="cards" class="cards"></div></section><section id="chartPanel" class="panel"><div class="toolbar"><h2>価格推移グラフ</h2><div id="ranges" class="segmented"><button data-days="7">7日</button><button data-days="30" class="active">30日</button><button data-days="90">90日</button><button data-days="0">全期間</button></div></div><div id="toggles" class="toggles"></div><div class="chartbox"><canvas id="chart"></canvas></div></section><section id="ranking" class="rank-grid"><article class="panel"><h2 class="up">↗ 本日の値上がりランキング</h2><div id="upRank"></div></article><article class="panel"><h2 class="down">↘ 本日の値下がりランキング</h2><div id="downRank"></div></article></section><section class="panel"><div class="toolbar"><h2>価格履歴</h2><select id="historyProduct"></select></div><div class="table-wrap"><table><thead><tr><th>日付</th><th>価格</th><th>前日比</th><th>前日比 (%)</th><th>最高値</th><th>最安値</th></tr></thead><tbody id="historyRows"></tbody></table></div></section><section id="productsPanel" class="panel"><div class="toolbar"><h2>商品一覧</h2><span id="productCount"></span></div><div id="products" class="product-grid"></div></section></main><footer><b>◓ PCG 相場チェッカー</b><span>スニダンの公開価格をもとに自動更新しています。</span></footer><script src="app.js"></script></body></html>
