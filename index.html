<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCG 相場チェッカー</title><link rel="stylesheet" href="style.css?v=20260923-5"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script><style>html.pcg-locked body{overflow:hidden}#pcgPinLock{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#pcgPinLock .pinbox{width:min(100%,390px);background:#fff;border:1px solid #e2e6ea;border-radius:18px;padding:30px 24px;box-shadow:0 12px 35px rgba(0,0,0,.08);text-align:center}#pcgPinLock .pinball{font-size:36px}#pcgPinLock h1{font-size:22px;margin:8px 0 6px}#pcgPinLock p{font-size:14px;color:#697078;margin:0 0 20px}#pcgPinLock input{width:100%;height:52px;border:1px solid #cfd5dc;border-radius:12px;font-size:24px;text-align:center;letter-spacing:.45em;padding-left:.45em;outline:none}#pcgPinLock input:focus{border-color:#555;box-shadow:0 0 0 3px rgba(0,0,0,.07)}#pcgPinLock button{width:100%;height:50px;margin-top:14px;border:0;border-radius:12px;background:#17191c;color:#fff;font-size:16px;font-weight:700;cursor:pointer}#pcgPinMsg{min-height:20px;margin-top:12px;font-size:13px;color:#c62828}</style><script>document.documentElement.classList.add("pcg-locked");</script></head><body><div id="pcgPinLock"><div class="pinbox"><div class="pinball">◓</div><h1>PCG 相場チェッカー</h1><p>アクセスするには暗証番号を入力してください。</p><form id="pcgPinForm"><input id="pcgPinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="暗証番号" placeholder="••••"><button type="submit">アクセス</button><div id="pcgPinMsg" role="alert"></div></form></div></div><header class="top"><div class="brand"><span class="ball">◓</span><div><b>PCG 相場チェッカー</b><small>ポケモンカードのBOX相場を毎日自動で更新</small></div></div><nav><a href="#today">ホーム</a><a href="#chartPanel">価格推移</a><a hre
